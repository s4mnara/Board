<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gerenciador de Boards</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --ink: #172b4d;
            --muted: #626f86;
            --line: #dfe1e6;
            --card: #ffffff;
            --col: #f1f2f4;
            --blue: #0c66e4;
            --blue-dark: #0055cc;
            --danger: #c9372c;
            --shadow: 0 1px 1px rgba(9, 30, 66, 0.25), 0 0 1px rgba(9, 30, 66, 0.31);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--bg);
        }
        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }
        header h1 { margin: 0; font-size: 24px; font-weight: 700; }
        .board-switch { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .chip, .chip-add {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            border-radius: 999px;
            padding: 10px 16px;
            font: inherit;
            font-size: 16px;
            cursor: pointer;
        }
        .chip.active { background: #e9f2ff; border-color: #85b8ff; color: var(--blue-dark); font-weight: 650; }
        .chip-add { color: var(--blue); border-style: dashed; }
        #toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 40;
            min-width: 260px;
            max-width: 420px;
            padding: 16px 18px;
            border-radius: 14px;
            background: #1d2125;
            color: #fff;
            font-size: 16px;
            font-weight: 650;
            box-shadow: 0 12px 32px rgba(9,30,66,.28);
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity .2s, transform .2s;
        }
        #toast.show { opacity: 1; transform: none; }
        #toast.error { background: #ae2e24; }
        #toast.success { background: #1f845a; }
        .modal-back {
            position: fixed;
            inset: 0;
            background: rgba(9,30,66,.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal {
            width: min(460px, calc(100% - 32px));
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 18px 50px rgba(9,30,66,.28);
        }
        .modal h2 { margin: 0 0 14px; font-size: 22px; }
        .modal input { font-size: 17px; padding: 12px 14px; }
        .modal .row { margin-top: 16px; justify-content: flex-end; }
        .board {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 20px 32px;
            overflow-x: auto;
            min-height: calc(100vh - 62px);
        }
        .column {
            width: 340px;
            flex: 0 0 340px;
            background: var(--col);
            border-radius: 12px;
            padding: 8px;
            max-height: calc(100vh - 96px);
            display: flex;
            flex-direction: column;
        }
        .column-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 6px 10px;
        }
        .column-head input {
            flex: 1;
            border: none;
            background: transparent;
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            outline: none;
            min-width: 0;
        }
        .count {
            font-size: 15px;
            color: var(--muted);
            background: #e4e6ea;
            border-radius: 999px;
            padding: 1px 7px;
        }
        .icon-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            border-radius: 6px;
            width: 40px;
            height: 40px;
            font-size: 26px;
        }
        .icon-btn:hover { background: rgba(9, 30, 66, 0.08); color: var(--ink); }
        .icon-btn.danger:hover { color: var(--danger); }
        .cards {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 2px 8px;
            min-height: 8px;
        }
        .card {
            background: var(--card);
            border-radius: 8px;
            padding: 10px 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
        }
        .card h3 { margin: 0; font-size: 17px; font-weight: 650; line-height: 1.35; }
        .card p { margin: 8px 0 0; font-size: 15px; color: var(--muted); }
        .card-actions { display: none; gap: 6px; margin-top: 8px; }
        .card.editing .card-actions, .card:hover .card-actions { display: flex; }
        .card input, .card textarea, .add-card input, .add-card textarea, .modal input {
            width: 100%;
            border: 1px solid #8590a2;
            border-radius: 6px;
            padding: 8px;
            font: inherit;
            font-size: 14px;
            outline: none;
        }
        .card textarea, .add-card textarea { resize: vertical; min-height: 52px; margin-top: 6px; }
        .add-card, .add-column {
            border: none;
            background: transparent;
            color: var(--muted);
            text-align: left;
            font: inherit;
            font-size: 16px;
            font-weight: 650;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .add-card:hover, .add-column:hover { background: rgba(9, 30, 66, 0.08); color: var(--ink); }
        .composer { display: flex; flex-direction: column; gap: 6px; }
        .row { display: flex; gap: 6px; }
        button.primary {
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font: inherit;
            font-size: 16px;
            font-weight: 650;
            cursor: pointer;
        }
        button.primary:hover { background: var(--blue-dark); }
        button.link {
            background: none;
            border: none;
            color: var(--muted);
            font: inherit;
            font-size: 16px;
            cursor: pointer;
        }
        .empty {
            margin: 48px auto;
            color: var(--muted);
            text-align: center;
        }
        .add-column-wrap {
            width: 340px;
            flex: 0 0 340px;
        }
    </style>
</head>
<body>
<header>
    <h1>Boards</h1>
    <div class="board-switch" id="board-switch"></div>
    </header>
<main class="board" id="board"></main>
<div id="toast" role="status"></div>
<script>
const API = 'http://localhost:8080';
const boardEl = document.getElementById('board');
const switchEl = document.getElementById('board-switch');
let boards = [];
let selectedId = null;

const toastEl = document.getElementById('toast');
let toastTimer;
function showMessage(text, type) {
    toastEl.textContent = text || '';
    toastEl.className = text ? ('show ' + (type || 'success')) : '';
    clearTimeout(toastTimer);
    if (text) toastTimer = setTimeout(() => { toastEl.className = ''; }, 3200);
}
function askText(title, placeholder, current, confirmLabel) {
    return new Promise(resolve => {
        const back = document.createElement('div');
        back.className = 'modal-back';
        const box = document.createElement('form');
        box.className = 'modal';
        const h = document.createElement('h2');
        h.textContent = title;
        const input = document.createElement('input');
        input.placeholder = placeholder || '';
        input.value = current || '';
        const row = document.createElement('div');
        row.className = 'row';
        const cancel = document.createElement('button');
        cancel.type = 'button';
        cancel.className = 'link';
        cancel.textContent = 'Cancelar';
        const ok = document.createElement('button');
        ok.type = 'submit';
        ok.className = 'primary';
        ok.textContent = confirmLabel || 'Salvar';
        const close = (value) => { back.remove(); resolve(value); };
        cancel.onclick = () => close(null);
        back.addEventListener('click', (e) => { if (e.target === back) close(null); });
        box.onsubmit = (e) => { e.preventDefault(); close(input.value.trim() || null); };
        row.append(cancel, ok);
        box.append(h, input, row);
        back.appendChild(box);
        document.body.appendChild(back);
        input.focus();
        input.select();
    });
}
function askConfirm(title) {
    return new Promise(resolve => {
        const back = document.createElement('div');
        back.className = 'modal-back';
        const box = document.createElement('div');
        box.className = 'modal';
        const h = document.createElement('h2');
        h.textContent = title;
        const row = document.createElement('div');
        row.className = 'row';
        const cancel = document.createElement('button');
        cancel.className = 'link';
        cancel.textContent = 'Cancelar';
        const ok = document.createElement('button');
        ok.className = 'primary';
        ok.textContent = 'Excluir';
        const close = (value) => { back.remove(); resolve(value); };
        cancel.onclick = () => close(false);
        ok.onclick = () => close(true);
        back.addEventListener('click', (e) => { if (e.target === back) close(false); });
        row.append(cancel, ok);
        box.append(h, row);
        back.appendChild(box);
        document.body.appendChild(back);
    });
}

async function api(path, options) {
    const res = await fetch(API + path, options);
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    if (res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
}

async function loadBoards() {
    boards = await api('/boards');
    if (!selectedId && boards.length) selectedId = boards[0].id;
    if (selectedId && !boards.some(b => b.id === selectedId)) selectedId = boards[0] ? boards[0].id : null;
    renderSwitch();
    await renderBoard();
}

function renderSwitch() {
    switchEl.innerHTML = '';
    boards.forEach(board => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (board.id === selectedId ? ' active' : '');
        btn.textContent = board.name;
        btn.onclick = async () => { selectedId = board.id; renderSwitch(); await renderBoard(); };
        switchEl.appendChild(btn);
    });
    const add = document.createElement('button');
    add.className = 'chip-add';
    add.textContent = '+ Board';
    add.onclick = async () => {
        const name = await askText('Novo board', 'Nome do board', '', 'Criar');
        if (!name) return;
        const created = await api('/boards', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, columns: [] })
        });
        selectedId = created && created.id ? created.id : null;
        showMessage('Board criado', 'success');
        await loadBoards();
    };
    switchEl.appendChild(add);
}

async function renderBoard() {
    boardEl.innerHTML = '';
    const board = boards.find(b => b.id === selectedId);
    if (!board) {
        boardEl.innerHTML = '<p class="empty">Crie um board para começar.</p>';
        return;
    }
    let columns = [];
    try {
        columns = await api('/boards/' + board.id + '/columns');
    } catch (e) {
        showMessage(e.message, 'error');
        return;
    }
    const cardsByColumn = await Promise.all(columns.map(async col => {
        try { return await api('/columns/' + col.id + '/cards'); }
        catch (e) { return []; }
    }));
    columns.forEach((col, i) => columnView(board, col, cardsByColumn[i] || []));
    addColumn(board);
}

function columnView(board, column, cards) {
    const col = document.createElement('section');
    col.className = 'column';
    const head = document.createElement('div');
    head.className = 'column-head';
    const name = document.createElement('input');
    name.value = column.name;
    name.addEventListener('change', async () => {
        const next = name.value.trim();
        if (!next) { name.value = column.name; return; }
        try {
            await api('/columns/' + column.id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: next })
            });
        } catch (e) { showMessage(e.message, 'error'); }
    });
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = cards.length;
    const del = document.createElement('button');
    del.className = 'icon-btn danger';
    del.textContent = '×';
    del.title = 'Excluir coluna';
    del.onclick = async () => {
        if (!await askConfirm('Excluir a coluna "' + column.name + '"?')) return;
        try {
            await api('/columns/' + column.id, { method: 'DELETE' });
            await renderBoard();
        } catch (e) { showMessage(e.message, 'error'); }
    };
    head.append(name, count, del);
    const list = document.createElement('div');
    list.className = 'cards';
    cards.forEach(card => list.appendChild(cardView(column, card)));
    const add = document.createElement('button');
    add.className = 'add-card';
    add.textContent = '+ Criar';
    add.onclick = () => openComposer(list, add, column);
    col.append(head, list, add);
    boardEl.appendChild(col);
}

function cardView(column, card) {
    const el = document.createElement('article');
    el.className = 'card';
    const title = document.createElement('h3');
    title.textContent = card.title || card.name || 'Sem título';
    el.appendChild(title);
    if (card.description) {
        const desc = document.createElement('p');
        desc.textContent = card.description;
        el.appendChild(desc);
    }
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const edit = document.createElement('button');
    edit.className = 'link';
    edit.textContent = 'Editar';
    edit.onclick = (ev) => { ev.stopPropagation(); editCard(el, column, card); };
    const remove = document.createElement('button');
    remove.className = 'link';
    remove.textContent = 'Excluir';
    remove.onclick = async (ev) => {
        ev.stopPropagation();
        if (!await askConfirm('Excluir este card?')) return;
        try {
            await api('/cards/' + card.id, { method: 'DELETE' });
            await renderBoard();
        } catch (e) { showMessage(e.message, 'error'); }
    };
    actions.append(edit, remove);
    el.appendChild(actions);
    return el;
}

function editCard(el, column, card) {
    el.classList.add('editing');
    el.innerHTML = '';
    const title = document.createElement('input');
    title.value = card.title || '';
    const desc = document.createElement('textarea');
    desc.value = card.description || '';
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    actions.style.display = 'flex';
    const save = document.createElement('button');
    save.className = 'primary';
    save.textContent = 'Salvar';
    save.onclick = async () => {
        if (!title.value.trim()) return showMessage('Informe o título', 'error');
        try {
            await api('/cards/' + card.id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: card.id, title: title.value.trim(), description: desc.value })
            });
            await renderBoard();
        } catch (e) { showMessage(e.message, 'error'); }
    };
    const cancel = document.createElement('button');
    cancel.className = 'link';
    cancel.textContent = 'Cancelar';
    cancel.onclick = () => renderBoard();
    actions.append(save, cancel);
    el.append(title, desc, actions);
}

function openComposer(list, button, column) {
    const box = document.createElement('div');
    box.className = 'composer';
    const title = document.createElement('input');
    title.placeholder = 'Título do card';
    const desc = document.createElement('textarea');
    desc.placeholder = 'Descrição (opcional)';
    const row = document.createElement('div');
    row.className = 'row';
    const save = document.createElement('button');
    save.className = 'primary';
    save.textContent = 'Criar';
    const cancel = document.createElement('button');
    cancel.className = 'link';
    cancel.textContent = 'Cancelar';
    cancel.onclick = () => { box.replaceWith(button); };
    save.onclick = async () => {
        if (!title.value.trim()) return showMessage('Informe o título', 'error');
        try {
            await api('/cards', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: title.value.trim(),
                    description: desc.value.trim(),
                    blocked: false,
                    blockReason: null,
                    blocksAmount: 0,
                    board_column_id: column.id
                })
            });
            showMessage('Card criado', 'success');
            await renderBoard();
        } catch (e) { showMessage(e.message, 'error'); }
    };
    row.append(save, cancel);
    box.append(title, desc, row);
    button.replaceWith(box);
    title.focus();
}

function addColumn(board) {
    const wrap = document.createElement('div');
    wrap.className = 'add-column-wrap';
    const btn = document.createElement('button');
    btn.className = 'add-card';
    btn.textContent = '+ Adicionar coluna';
    btn.onclick = async () => {
        const name = await askText('Nova coluna', 'Nome da coluna', '', 'Adicionar');
        if (!name) return;
        try {
            await api('/boards/' + board.id + '/columns', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, tasks: [] })
            });
            showMessage('Coluna criada', 'success');
            await renderBoard();
        } catch (e) { showMessage(e.message, 'error'); }
    };
    wrap.appendChild(btn);
    boardEl.appendChild(wrap);
}

loadBoards().catch(e => showMessage(e.message, 'error'));
</script>
</body>
</html>
